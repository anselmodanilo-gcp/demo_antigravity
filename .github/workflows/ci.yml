name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: apps/whatsapp-lead-assistant

jobs:
  python:
    name: lint, tipos, testes e SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.lock
      - name: Instalar dependências (hashes verificados)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
      - name: Ruff (formatação e lint)
        run: |
          ruff format --check .
          ruff check --output-format=github .
      - name: mypy (strict)
        run: mypy
      - name: pytest + cobertura (mínimo 85%)
        env:
          PYTHONPATH: src
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: bandit (SAST)
        run: bandit -q -c pyproject.toml -r src
      - name: pip-audit (vulnerabilidades em dependências)
        run: pip-audit -r requirements.lock --require-hashes --disable-pip

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: imagem (hadolint + build + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.APP_DIR }}/Dockerfile
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        run: docker build -t wla:ci "$APP_DIR"
      - name: Trivy (CRITICAL/HIGH com correção disponível)
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: wla:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Smoke test da imagem
        run: |
          docker run -d --name wla -p 8080:8080 -e WLA_APP=ingress wla:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/webhook?hub.mode=subscribe&hub.verify_token=x&hub.challenge=1')" = "403"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' localhost:8080/webhook)" = "503"
          docker logs wla
          test "$(docker exec wla id -u)" = "10001"

  terraform:
    name: terraform (fmt, validate, checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate
        working-directory: infra/terraform/envs/demo
        run: |
          terraform init -backend=false -input=false
          terraform validate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: checkov
        run: |
          pip install checkov==3.3.26
          checkov -d infra/terraform --framework terraform --quiet --compact \
            --config-file infra/terraform/.checkov.yaml
