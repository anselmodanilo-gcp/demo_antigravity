version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/whatsapp-lead-assistant
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/whatsapp-lead-assistant
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra/terraform/envs/demo
    schedule:
      interval: weekly
